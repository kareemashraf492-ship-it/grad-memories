<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المشرف - إدارة الخريجين</title>
  <style>
    :root {
      --primary: #0d3b82;
      --primary-hover: #092a5e;
      --accent: #d97706;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
    .container { width: 100%; max-width: 900px; }
    #loginScreen { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); width: 100%; max-width: 400px; margin: 60px auto 0; text-align: center; }
    .input-field { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
    .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-slideshow { background: linear-gradient(135deg, #1e3a8a, #d97706); color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; width: 100%; margin-bottom: 15px; }
    .btn-excel { background: var(--success); color: white; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
    .btn-excel:hover { background: #15803d; }
    #adminDashboard { display: none; background: white; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .form-card { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .table-container { max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: right; }
    th { background: #f8fafc; color: #475569; }
    .status-tag { padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 600; }
    .status-tag.done { background: #dcfce7; color: #15803d; }
    .status-tag.waiting { background: #fef3c7; color: #b45309; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .excel-box { display: flex; justify-content: space-between; align-items: center; background: #ecfdf5; border: 1px dashed #059669; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div id="loginScreen">
    <div style="font-size: 2.5rem; margin-bottom: 10px;">🔐</div>
    <h2 style="color:var(--primary); margin-bottom:20px;">تسجيل دخول المشرف</h2>
    <input type="password" id="adminPasswordInput" class="input-field" placeholder="أدخل كلمة المرور" onkeypress="if(event.key==='Enter') checkPassword()">
    <button class="btn" style="width:100%;" onclick="checkPassword()">دخول للوحة التحكم</button>
  </div>

  <div class="container">
    <div id="adminDashboard">
      <div class="top-bar">
        <div>
          <h2 style="color:var(--primary);">لوحة إدارة الخريجين والداتا شو</h2>
        </div>
        <div>
          <a href="index.html" target="_blank" style="margin-left:15px; color:var(--primary); font-weight:bold; text-decoration:none;">🌐 اللوحة العامة</a>
          <button onclick="location.reload()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">🚪 خروج</button>
        </div>
      </div>

      <button class="btn btn-slideshow" id="exportPptxBtn" onclick="generatePowerPoint()">
        🎬 تحميل عرض الداتا شو للحفل (PowerPoint .pptx)
      </button>

      <div class="excel-box">
        <div>
          <strong style="color: #065f46;">📊 استيراد قائمة الطلاب من ملف Excel:</strong>
          <p style="font-size: 0.8rem; color: #047857; margin-top: 3px;">يحتوي على عمود للكود وعمود للاسم.</p>
        </div>
        <button class="btn btn-excel" onclick="document.getElementById('excelFileInput').click()">
          📁 رفع ملف إكسيل
        </button>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelUpload(event)">
      </div>

      <div class="form-card">
        <h4 style="margin-bottom: 10px;">➕ إضافة طالب يدوي:</h4>
        <div class="form-row">
          <input type="text" id="newCode" class="input-field" placeholder="الكود (مثال: 2026-01)" style="flex:1; margin-bottom:0;">
          <input type="text" id="newName" class="input-field" placeholder="اسم الطالب رباعي" style="flex:2; margin-bottom:0;">
        </div>
        <button class="btn" style="width:100%; margin-top:10px;" id="addBtn" onclick="addStudent()">حفظ الطالب في قاعدة البيانات</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>الكود</th>
              <th>الاسم</th>
              <th>الحالة</th>
              <th>الذكرى المسجلة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr><td colspan="5" style="text-align:center;">جاري جلب البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin2026";

    const firebaseConfig = {
      apiKey: "AIzaSyCv5lNRVRD4kqJLA8lmez7eonzVDkuKx6A",
      authDomain: "grad-memories.firebaseapp.com",
      projectId: "grad-memories",
      storageBucket: "grad-memories.firebasestorage.app",
      messagingSenderId: "814899044477",
      appId: "1:814899044477:web:89ed1ba54afeb3e17dd114",
      measurementId: "G-W27KFYHQF2"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let studentsList = [];

    function checkPassword() {
      if (document.getElementById('adminPasswordInput').value === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        listenToStudents();
      } else {
        alert('❌ كلمة المرور غير صحيحة!');
      }
    }

    function listenToStudents() {
      db.collection("students").onSnapshot((snapshot) => {
        studentsList = [];
        snapshot.forEach(doc => studentsList.push({ id: doc.id, ...doc.data() }));
        renderAdminTable();
      });
    }

    function renderAdminTable() {
      const tbody = document.getElementById('studentsTableBody');
      tbody.innerHTML = '';

      if (studentsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">لا يوجد طلاب مسجلون حتى الآن.</td></tr>`;
        return;
      }

      studentsList.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${student.code}</strong></td>
          <td>${student.name}</td>
          <td><span class="status-tag ${student.submitted ? 'done' : 'waiting'}">${student.submitted ? 'سجّل ذكراه' : 'في الانتظار'}</span></td>
          <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${student.note || '—'}</td>
          <td><button class="btn-delete" onclick="deleteStudent('${student.id}', '${student.name}')">حذف</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addStudent() {
      const code = document.getElementById('newCode').value.trim().toUpperCase();
      const name = document.getElementById('newName').value.trim();

      if (!code || !name) return alert('يرجى كتابة الكود والاسم.');
      if (studentsList.some(s => String(s.code).toUpperCase() === code)) return alert('هذا الكود مستخدم بالفعل.');

      const addBtn = document.getElementById('addBtn');
      addBtn.disabled = true;

      try {
        await db.collection("students").add({
          code: code,
          name: name,
          photo: '',
          note: '',
          submitted: false
        });
        document.getElementById('newCode').value = '';
        document.getElementById('newName').value = '';
      } catch (err) {
        alert('حدث خطأ أثناء الإضافة: ' + err.message);
      } finally {
        addBtn.disabled = false;
      }
    }

    async function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          if (rows.length < 2) return alert('الملف فارغ أو غير صالح.');

          const headers = rows[0].map(h => String(h).trim().toLowerCase());
          let codeIdx = headers.findIndex(h => h.includes('كود') || h.includes('code') || h.includes('id'));
          let nameIdx = headers.findIndex(h => h.includes('اسم') || h.includes('name'));

          if (codeIdx === -1) codeIdx = 0;
          if (nameIdx === -1) nameIdx = 1;

          let addedCount = 0;
          const batch = db.batch();

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const code = row[codeIdx] ? String(row[codeIdx]).trim().toUpperCase() : '';
            const name = row[nameIdx] ? String(row[nameIdx]).trim() : '';

            if (code && name) {
              if (!studentsList.some(s => String(s.code).toUpperCase() === code)) {
                const newDocRef = db.collection("students").doc();
                batch.set(newDocRef, {
                  code: code,
                  name: name,
                  photo: '',
                  note: '',
                  submitted: false
                });
                addedCount++;
              }
            }
          }

          if (addedCount > 0) {
            await batch.commit();
            alert(`✅ تم استيراد (${addedCount}) طالب بنجاح!`);
          } else {
            alert('لم تتم إضافة أي طالب جديد (تأكد من عدم تكرار الأكواد).');
          }

        } catch (err) {
          alert('حدث خطأ أثناء القراءة: ' + err.message);
        } finally {
          event.target.value = '';
        }
      };

      reader.readAsArrayBuffer(file);
    }

    async function deleteStudent(docId, name) {
      if (confirm(`هل أنت متأكد من حذف الطالب (${name})؟`)) {
        try {
          await db.collection("students").doc(docId).delete();
        } catch (err) {
          alert('تعذر الحذف: ' + err.message);
        }
      }
    }

    async function generatePowerPoint() {
      const submittedStudents = studentsList.filter(s => s.submitted);

      if (submittedStudents.length === 0) {
        alert('⚠️ لا يوجد طلاب قاموا بتسجيل ذكرياتهم بعد!');
        return;
      }

      const pptxBtn = document.getElementById('exportPptxBtn');
      pptxBtn.innerText = '⏳ جاري إنشاء العرض التقديمي...';
      pptxBtn.disabled = true;

      try {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        let introSlide = pptx.addSlide();
        introSlide.background = { color: '0D1B2A' };
        introSlide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 0, w: '100%', h: 0.2, fill: { color: 'D97706' } });
        introSlide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 7.3, w: '100%', h: 0.2, fill: { color: 'D97706' } });

        introSlide.addText('🎓 حَفْلُ تَخَرُّجِ الدُّفْعَةِ', {
          x: 1, y: 2.2, w: 11.3, h: 1.2,
          fontSize: 44, color: 'FFFFFF', bold: true, align: 'center', rtlMode: true
        });

        introSlide.addText('ذكريات وطموحات تصنع المستقبل ✨', {
          x: 1, y: 3.6, w: 11.3, h: 0.8,
          fontSize: 24, color: 'D97706', align: 'center', rtlMode: true
        });

        submittedStudents.forEach((student) => {
          let slide = pptx.addSlide();
          slide.background = { color: '0F172A' };

          slide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 0, w: '100%', h: 0.15, fill: { color: 'D97706' } });
          slide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 7.35, w: '100%', h: 0.15, fill: { color: 'D97706' } });

          slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
            x: 8.3, y: 1.2, w: 4.2, h: 5.2,
            fill: { color: '1E293B' },
            line: { color: 'D97706', width: 2 }
          });

          if (student.photo && student.photo.startsWith('data:image')) {
            slide.addImage({
              data: student.photo,
              x: 8.5, y: 1.4, w: 3.8, h: 4.8,
              rounding: true
            });
          } else {
            slide.addText('🎓', {
              x: 8.5, y: 2.5, w: 3.8, h: 2,
              fontSize: 65, align: 'center'
            });
          }

          slide.addText(student.name, {
            x: 0.8, y: 1.4, w: 7.0, h: 0.9,
            fontSize: 32, color: 'FFFFFF', bold: true, align: 'right', rtlMode: true
          });

          slide.addText(`كود الخريج: ${student.code}`, {
            x: 0.8, y: 2.3, w: 7.0, h: 0.5,
            fontSize: 16, color: 'D97706', bold: true, align: 'right', rtlMode: true
          });

          slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
            x: 0.8, y: 3.1, w: 7.0, h: 3.3,
            fill: { color: '1E293B' },
            line: { color: '334155', width: 1 }
          });

          slide.addText(`“ ${student.note || 'مبروك التخرج!'} ”`, {
            x: 1.1, y: 3.4, w: 6.4, h: 2.7,
            fontSize: 19, color: 'E2E8F0', italic: true, align: 'right', rtlMode: true
          });
        });

        await pptx.writeFile({ fileName: `Graduation_Show_${new Date().getFullYear()}.pptx` });
      } catch (err) {
        alert('حدث خطأ أثناء التوليد: ' + err.message);
      } finally {
        pptxBtn.innerText = '🎬 تحميل عرض الداتا شو للحفل (PowerPoint .pptx)';
        pptxBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
