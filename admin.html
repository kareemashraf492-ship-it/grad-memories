<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 لوحة المشرف - إدارة حفل التخرج</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #d97706;
      --gold-gradient: linear-gradient(135deg, #fbbf24, #d97706);
      --bg-gradient: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      position: relative;
      overflow-x: hidden;
    }

    .glow-sphere {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 950px;
      position: relative;
      z-index: 1;
    }

    /* شاشة تسجيل الدخول الزجاجية */
    #loginScreen {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 420px;
      margin: 80px auto 0;
      text-align: center;
    }

    #loginScreen h2 {
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: 800;
    }

    #loginScreen h2 span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .input-field:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 1rem;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
      width: 100%;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5);
    }

    /* لوحة التحكم الرئيسية */
    #adminDashboard {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar h2 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .top-bar h2 span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-bar-links a, .top-bar-links button {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 700;
      margin-left: 15px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .top-bar-links button {
      color: var(--danger);
    }

    /* بطاقات وأزرار الإجراءات */
    .btn-slideshow {
      background: var(--gold-gradient);
      color: #0f172a;
      width: 100%;
      font-size: 1.1rem;
      margin-bottom: 20px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.3);
    }

    .btn-slideshow:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5);
    }

    .excel-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed rgba(16, 185, 129, 0.4);
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .btn-excel {
      background: var(--success);
      color: white;
      padding: 10px 18px;
    }

    .btn-excel:hover {
      background: #059669;
    }

    .form-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    /* جدول الطلاب */
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: #fbbf24;
      font-weight: 800;
    }

    .status-tag {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-tag.done {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .status-tag.waiting {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>

  <div class="glow-sphere"></div>

  <!-- شاشة الدخول -->
  <div id="loginScreen">
    <div style="font-size: 3rem; margin-bottom: 15px;">🔐</div>
    <h2>لوحة تحكم <span>المشرف</span></h2>
    <input type="password" id="adminPasswordInput" class="input-field" placeholder="أدخل كلمة المرور" onkeypress="if(event.key==='Enter') checkPassword()">
    <button class="btn btn-gold" onclick="checkPassword()">دخول للوحة التحكم 🚀</button>
  </div>

  <!-- لوحة التحكم الرئيسية -->
  <div class="container">
    <div id="adminDashboard">
      <div class="top-bar">
        <div>
          <h2>لوحة إدارة <span>الخريجين والداتا شو</span> 🎓</h2>
        </div>
        <div class="top-bar-links">
          <a href="index.html" target="_blank">🌐 عرض اللوحة العامة</a>
          <button onclick="location.reload()">🚪 خروج</button>
        </div>
      </div>

      <button class="btn btn-slideshow" id="exportPptxBtn" onclick="generatePowerPoint()">
        🎬 تحميل عرض الداتا شو للحفل (PowerPoint .pptx)
      </button>

      <!-- رفع إكسيل -->
      <div class="excel-box">
        <div>
          <strong style="color: #34d399; font-size:1.05rem;">📊 استيراد قائمة الطلاب من ملف Excel:</strong>
          <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 3px;">يرجى التأكد من احتواء الملف على عمود للكود وعمود للاسم.</p>
        </div>
        <button class="btn btn-excel" onclick="document.getElementById('excelFileInput').click()">
          📁 رفع ملف إكسيل
        </button>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelUpload(event)">
      </div>

      <!-- إضافة طالب يدوي -->
      <div class="form-card">
        <h4 style="margin-bottom: 12px; color: #fbbf24;">➕ إضافة طالب يدوي:</h4>
        <div class="form-row">
          <input type="text" id="newCode" class="input-field" placeholder="الكود (مثال: 2020523)" style="flex:1; margin-bottom:0;">
          <input type="text" id="newName" class="input-field" placeholder="اسم الطالب رباعي" style="flex:2; margin-bottom:0;">
        </div>
        <button class="btn btn-gold" style="margin-top:12px;" id="addBtn" onclick="addStudent()">حفظ الطالب في السحابة 💾</button>
      </div>

      <!-- جدول الطلاب -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>الكود</th>
              <th>الاسم</th>
              <th>الحالة</th>
              <th>الذكرى المسجلة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr><td colspan="5" style="text-align:center; padding: 25px; color:#94a3b8;">جاري جلب البيانات السحابية... ✨</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin2026";

    const firebaseConfig = {
      apiKey: "AIzaSyCv5lNRVRD4kqJLA8lmez7eonzVDkuKx6A",
      authDomain: "grad-memories.firebaseapp.com",
      projectId: "grad-memories",
      storageBucket: "grad-memories.firebasestorage.app",
      messagingSenderId: "814899044477",
      appId: "1:814899044477:web:89ed1ba54afeb3e17dd114",
      measurementId: "G-W27KFYHQF2"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let studentsList = [];

    function checkPassword() {
      if (document.getElementById('adminPasswordInput').value === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        listenToStudents();
      } else {
        alert('❌ كلمة المرور غير صحيحة!');
      }
    }

    function listenToStudents() {
      db.collection("students").onSnapshot((snapshot) => {
        studentsList = [];
        snapshot.forEach(doc => studentsList.push({ id: doc.id, ...doc.data() }));
        renderAdminTable();
      });
    }

    function renderAdminTable() {
      const tbody = document.getElementById('studentsTableBody');
      tbody.innerHTML = '';

      if (studentsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 25px; color:#94a3b8;">لا يوجد طلاب مسجلون حتى الآن.</td></tr>`;
        return;
      }

      studentsList.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong style="color:#fbbf24;">${student.code}</strong></td>
          <td style="font-weight:700;">${student.name}</td>
          <td><span class="status-tag ${student.submitted ? 'done' : 'waiting'}">${student.submitted ? 'تم التوثيق 🎓' : 'في الانتظار ⏳'}</span></td>
          <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#cbd5e1;">${student.note || '—'}</td>
          <td><button class="btn-delete" onclick="deleteStudent('${student.id}', '${student.name}')">حذف</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addStudent() {
      const code = document.getElementById('newCode').value.trim().toUpperCase();
      const name = document.getElementById('newName').value.trim();

      if (!code || !name) return alert('يرجى كتابة الكود والاسم.');
      if (studentsList.some(s => String(s.code).toUpperCase() === code)) return alert('هذا الكود مستخدم بالفعل.');

      const addBtn = document.getElementById('addBtn');
      addBtn.disabled = true;

      try {
        await db.collection("students").add({
          code: code,
          name: name,
          photo: '',
          note: '',
          submitted: false
        });
        document.getElementById('newCode').value = '';
        document.getElementById('newName').value = '';
      } catch (err) {
        alert('حدث خطأ أثناء الإضافة: ' + err.message);
      } finally {
        addBtn.disabled = false;
      }
    }

    async function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          if (rows.length < 2) return alert('الملف فارغ أو غير صالح.');

          const headers = rows[0].map(h => String(h).trim().toLowerCase());
          let codeIdx = headers.findIndex(h => h.includes('كود') || h.includes('code') || h.includes('id'));
          let nameIdx = headers.findIndex(h => h.includes('اسم') || h.includes('name'));

          if (codeIdx === -1) codeIdx = 0;
          if (nameIdx === -1) nameIdx = 1;

          let addedCount = 0;
          const batch = db.batch();

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const code = row[codeIdx] ? String(row[codeIdx]).trim().toUpperCase() : '';
            const name = row[nameIdx] ? String(row[nameIdx]).trim() : '';

            if (code && name) {
              if (!studentsList.some(s => String(s.code).toUpperCase() === code)) {
                const newDocRef = db.collection("students").doc();
                batch.set(newDocRef, {
                  code: code,
                  name: name,
                  photo: '',
                  note: '',
                  submitted: false
                });
                addedCount++;
              }
            }
          }

          if (addedCount > 0) {
            await batch.commit();
            alert(`✅ تم استيراد (${addedCount}) طالب بنجاح!`);
          } else {
            alert('لم تتم إضافة أي طالب جديد (تأكد من عدم تكرار الأكواد).');
          }

        } catch (err) {
          alert('حدث خطأ أثناء القراءة: ' + err.message);
        } finally {
          event.target.value = '';
        }
      };

      reader.readAsArrayBuffer(file);
    }

    async function deleteStudent(docId, name) {
      if (confirm(`هل أنت متأكد من حذف الطالب (${name})؟`)) {
        try {
          await db.collection("students").doc(docId).delete();
        } catch (err) {
          alert('تعذر الحذف: ' + err.message);
        }
      }
    }

    async function generatePowerPoint() {
      const submittedStudents = studentsList.filter(s => s.submitted);

      if (submittedStudents.length === 0) {
        alert('⚠️ لا يوجد طلاب قاموا بتسجيل ذكرياتهم بعد!');
        return;
      }

      const pptxBtn = document.getElementById('exportPptxBtn');
      pptxBtn.innerText = '⏳ جاري إنشاء العرض التقديمي...';
      pptxBtn.disabled = true;

      try {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        let introSlide = pptx.addSlide();
        introSlide.background = { color: '0D1B2A' };

        introSlide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 0, w: 10.0, h: 0.15, fill: { color: 'D97706' } });
        introSlide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 5.47, w: 10.0, h: 0.15, fill: { color: 'D97706' } });

        introSlide.addText('🎓 حَفْلُ تَخَرُّجِ الدُّفْعَةِ', {
          x: 0.5, y: 1.8, w: 9.0, h: 1.0,
          fontSize: 40, color: 'FFFFFF', bold: true, align: 'center', isRTL: true
        });

        introSlide.addText('ذكريات وطموحات تصنع المستقبل ✨', {
          x: 0.5, y: 2.9, w: 9.0, h: 0.8,
          fontSize: 22, color: 'D97706', align: 'center', isRTL: true
        });

        submittedStudents.forEach((student) => {
          let slide = pptx.addSlide();
          slide.background = { color: '0F172A' };

          slide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 0, w: 10.0, h: 0.12, fill: { color: 'D97706' } });
          slide.addShape(pptx.shapes.RECTANGLE, { x: 0, y: 5.5, w: 10.0, h: 0.12, fill: { color: 'D97706' } });

          slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
            x: 6.6, y: 0.7, w: 2.8, h: 4.2,
            fill: { color: '1E293B' },
            line: { color: 'D97706', width: 2 },
            rectRadius: 0.15
          });

          if (student.photo && student.photo.startsWith('data:image')) {
            slide.addImage({
              data: student.photo,
              x: 6.75, y: 0.85, w: 2.5, h: 3.9,
              rounding: true
            });
          } else {
            slide.addText('🎓', {
              x: 6.75, y: 1.8, w: 2.5, h: 1.5,
              fontSize: 60, align: 'center'
            });
          }

          slide.addText(student.name, {
            x: 0.6, y: 0.8, w: 5.7, h: 0.6,
            fontSize: 26, color: 'FFFFFF', bold: true, align: 'right', isRTL: true
          });

          slide.addText(`كود الخريج: ${student.code}`, {
            x: 0.6, y: 1.45, w: 5.7, h: 0.4,
            fontSize: 14, color: 'D97706', bold: true, align: 'right', isRTL: true
          });

          slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
            x: 0.6, y: 2.0, w: 5.7, h: 2.9,
            fill: { color: '1E293B' },
            line: { color: '334155', width: 1 },
            rectRadius: 0.15
          });

          slide.addText(`“ ${student.note || 'مبروك التخرج والتوفيق دائماً!'} ”`, {
            x: 0.8, y: 2.2, w: 5.3, h: 2.5,
            fontSize: 16, color: 'E2E8F0', italic: true, align: 'right', isRTL: true, valign: 'top'
          });
        });

        await pptx.writeFile({ fileName: `Graduation_Show_${new Date().getFullYear()}.pptx` });
      } catch (err) {
        alert('حدث خطأ أثناء التوليد: ' + err.message);
      } finally {
        pptxBtn.innerText = '🎬 تحميل عرض الداتا شو للحفل (PowerPoint .pptx)';
        pptxBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
