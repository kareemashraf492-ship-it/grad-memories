<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 لوحة ذكريات دفعة التخرج</title>
  
  <!-- خط تجوال الاحترافي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة القصاصات الاحتفالية الملونة -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #d97706;
      --gold-gradient: linear-gradient(135deg, #fbbf24, #d97706);
      --bg-gradient: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --accent: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
      position: relative;
    }

    /* كرات الإضاءة الاحتفالية في الخلفية */
    .glow-sphere {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
      pointer-events: none;
    }

    .glow-sphere-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      bottom: 50px;
      left: -100px;
      z-index: 0;
      pointer-events: none;
    }

    /* الهيدر الاحتفالي */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 45px 20px 20px;
    }

    .cap-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 15px;
      backdrop-filter: blur(8px);
    }

    header h1 {
      color: #ffffff;
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    header h1 span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #94a3b8;
      font-size: 1.15rem;
      max-width: 650px;
      margin: 0 auto 25px;
    }

    /* أزرار التحكم الرئيسية */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .btn {
      padding: 12px 26px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #0f172a;
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.35);
    }

    .btn-gold:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 30px rgba(217, 119, 6, 0.6);
    }

    .btn-fireworks {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .btn-fireworks:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    /* شريط الإحصائيات الزجاجي */
    .stats-container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
    }

    .stats-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 30px;
      border-radius: 40px;
      color: #e2e8f0;
      font-size: 1rem;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .stats-pill strong {
      color: #fbbf24;
      font-size: 1.1rem;
    }

    /* شبكة بطاقات الذكريات */
    .grid-container {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .memory-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .memory-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(217, 119, 6, 0.25);
    }

    .memory-card.submitted {
      border: 2px solid rgba(251, 191, 36, 0.8);
      background: rgba(30, 41, 59, 0.85);
    }

    .memory-card.pending {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.5);
    }

    /* صورة الخريج وإطار التخرج الملكي */
    .avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
      border: 3.5px solid #fbbf24;
      box-shadow: 0 6px 20px rgba(217, 119, 6, 0.35);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-name {
      font-weight: 800;
      font-size: 1.15rem;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .card-code {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      direction: ltr;
    }

    .card-note {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.5;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 14px;
      width: 100%;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      font-style: italic;
    }

    .memory-card.pending .card-note {
      background: rgba(255, 255, 255, 0.03);
      color: #64748b;
      font-style: normal;
    }

    /* نافذة تسجيل الطالب الزجاجية */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      padding: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fbbf24;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
    }

    .preview-box {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 10px auto 15px;
      overflow: hidden;
      border: 3px dashed #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.6);
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="glow-sphere"></div>
  <div class="glow-sphere-2"></div>

  <!-- الهيدر الاحتفالي -->
  <header>
    <div class="cap-badge">🎉 ألف مبروك التخرج</div>
    <h1>لوحة ذكريات <span>دفعة التخرج</span> 🎓</h1>
    <p>لحظات وتعب سنين نوثقها هنا لتظل ذكرى خالدة بيننا مهما مر الزمان ✨</p>

    <div class="action-bar">
      <button class="btn btn-gold" onclick="openStudentModal()">
        ✍️ سجّل ذكرى تخرجك الآن
      </button>
      <button class="btn btn-fireworks" onclick="launchConfetti()">
        🎊 احتفل بالدفعة
      </button>
    </div>
  </header>

  <!-- عداد الإحصائيات -->
  <div class="stats-container">
    <div class="stats-pill">
      <div>إجمالي الخريجين: <strong id="totalStudents">0</strong></div>
      <div>|</div>
      <div>تم توثيق الذكريات: <strong id="submittedCount">0</strong> 🎓</div>
    </div>
  </div>

  <!-- شبكة البطاقات -->
  <div class="grid-container" id="cardsGrid">
    <p style="grid-column: 1/-1; text-align:center; color:#94a3b8; font-size:1.1rem; padding: 40px 0;">
      جاري تحميل ذكريات الدفعة السحابية... ✨
    </p>
  </div>

  <!-- نافذة تسجيل الذكرى -->
  <div class="modal-overlay" id="studentModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🎓 توثيق ذكرى خريج</h3>
        <button class="close-btn" onclick="closeStudentModal()">&times;</button>
      </div>

      <!-- الخطوة 1: كود الطالب -->
      <div id="codeStep">
        <div class="form-group">
          <label>أدخل الكود التعريفي الخاص بك:</label>
          <input type="text" id="verifyCode" placeholder="مثال: 2020523" style="text-transform: uppercase;">
        </div>
        <button class="btn btn-gold" style="width:100%;" onclick="verifyStudentCode()">
          تحقق من الكود 🔍
        </button>
      </div>

      <!-- الخطوة 2: رفع الصورة والذكرى -->
      <div id="dataStep" style="display: none;">
        <div class="form-group">
          <label>اسم الخريج المعتمد:</label>
          <input type="text" id="studentNameDisplay" disabled style="background: rgba(15, 23, 42, 0.5); font-weight:bold; color:#fbbf24; border-color: rgba(251, 191, 36, 0.4);">
        </div>

        <div class="preview-box" id="avatarPreview">
          <span style="font-size:2.8rem;">🎓</span>
        </div>

        <div class="form-group">
          <label>صورتك الشخصية بالتخرج:</label>
          <input type="file" id="studentPhotoInput" accept="image/*" onchange="previewImage(event)">
        </div>

        <div class="form-group">
          <label>كلمة للتاريخ / ذكرى تخرجك:</label>
          <textarea id="studentNoteInput" rows="3" placeholder="اكتب ما تحب أن يقرأه زملاؤك بعد سنين..."></textarea>
        </div>

        <button class="btn btn-gold" style="width: 100%;" id="saveBtn" onclick="saveStudentMemory()">
          حفظ وتثبيت على اللوحة للأبد 🎓
        </button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCv5lNRVRD4kqJLA8lmez7eonzVDkuKx6A",
      authDomain: "grad-memories.firebaseapp.com",
      projectId: "grad-memories",
      storageBucket: "grad-memories.firebasestorage.app",
      messagingSenderId: "814899044477",
      appId: "1:814899044477:web:89ed1ba54afeb3e17dd114",
      measurementId: "G-W27KFYHQF2"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];
    let currentDocId = null;
    let tempPhotoBase64 = '';

    window.addEventListener('load', () => {
      launchConfetti();
    });

    function launchConfetti() {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#fbbf24', '#f59e0b', '#3b82f6', '#10b981', '#ffffff']
      });
    }

    db.collection("students").onSnapshot((snapshot) => {
      allStudents = [];
      snapshot.forEach(doc => allStudents.push({ id: doc.id, ...doc.data() }));
      renderBoard();
    });

    function renderBoard() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      let submittedCount = 0;

      if (allStudents.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; margin:40px 0;">لم يتم إضافة طلاب حتى الآن من قبل المشرف.</p>`;
      }

      allStudents.forEach(student => {
        if (student.submitted) submittedCount++;
        const card = document.createElement('div');
        card.className = `memory-card ${student.submitted ? 'submitted' : 'pending'}`;
        card.innerHTML = `
          <div class="avatar-wrapper">
            ${student.photo ? `<img src="${student.photo}">` : `<span style="font-size:2.8rem;">🎓</span>`}
          </div>
          <div class="card-name">${student.name}</div>
          <div class="card-code">${student.code}</div>
          <div class="card-note">${student.submitted ? `“ ${student.note} ”` : 'في انتظار توثيق الذكرى... ⏳'}</div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('totalStudents').innerText = allStudents.length;
      document.getElementById('submittedCount').innerText = submittedCount;
    }

    function openStudentModal() {
      document.getElementById('codeStep').style.display = 'block';
      document.getElementById('dataStep').style.display = 'none';
      document.getElementById('verifyCode').value = '';
      currentDocId = null;
      tempPhotoBase64 = '';
      document.getElementById('studentModal').style.display = 'flex';
    }

    function closeStudentModal() {
      document.getElementById('studentModal').style.display = 'none';
    }

    async function verifyStudentCode() {
      const inputCode = document.getElementById('verifyCode').value.trim().toUpperCase();
      if (!inputCode) return alert('يرجى إدخال الكود أولاً.');

      const student = allStudents.find(s => String(s.code).toUpperCase() === inputCode);
      if (!student) return alert('❌ الكود غير مسجل في قائمة الخريجين المعتمدين!');

      if (student.submitted) {
        alert(`⚠️ عذراً يا ${student.name}، لقد قمت بتسجيل ذكراك مسبقاً ولا يمكن تعديلها.`);
        return;
      }

      currentDocId = student.id;
      document.getElementById('studentNameDisplay').value = student.name;
      document.getElementById('studentNoteInput').value = '';
      document.getElementById('avatarPreview').innerHTML = `<span style="font-size:2.8rem;">🎓</span>`;
      tempPhotoBase64 = '';

      document.getElementById('codeStep').style.display = 'none';
      document.getElementById('dataStep').style.display = 'block';
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          tempPhotoBase64 = e.target.result;
          document.getElementById('avatarPreview').innerHTML = `<img src="${tempPhotoBase64}">`;
        };
        reader.readAsDataURL(file);
      }
    }

    async function saveStudentMemory() {
      const note = document.getElementById('studentNoteInput').value.trim();
      if (!note) return alert('يرجى كتابة كلمة تخرجك.');

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'جاري الحفظ والتوثيق بالسحابة...';

      try {
        await db.collection("students").doc(currentDocId).update({
          note: note,
          photo: tempPhotoBase64,
          submitted: true
        });
        
        launchConfetti();
        alert('🎉 مبارك التخرج! تم حفظ وتثبيت ذكراك بنجاح في سجل الدفعة.');
        closeStudentModal();
      } catch (err) {
        alert('حدث خطأ أثناء الحفظ: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'حفظ وتثبيت على اللوحة للأبد 🎓';
      }
    }
  </script>
</body>
</html>
